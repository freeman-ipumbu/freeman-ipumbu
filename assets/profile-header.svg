<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Freeman Ipumbu</title>
  <desc id="desc">Systems, networks, design science and product engineering from Windhoek, Namibia.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070c12"/>
      <stop offset="0.56" stop-color="#101b25"/>
      <stop offset="1" stop-color="#081018"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.18" cy="0.05" r="0.88">
