<svg xmlns="http://www.w3.org/2000/svg" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title desc">
  <title id="title">Freeman Ipumbu SolarSpin founder banner</title>
  <desc id="desc">A founder banner for Freeman Ipumbu, Technical Director at TPTS Namibia and Founder and CEO of SolarSpin Technologies.</desc>
  <rect width="1584" height="396" fill="#071522"/>
  <g fill="none" transform="translate(1328 198) rotate(-13)">
    <ellipse rx="390" ry="150" stroke="#304155" stroke-width="3" stroke-dasharray="7 19"/>
    <ellipse rx="295" ry="102" stroke="#5655E8" stroke-width="5" stroke-dasharray="172 34"/>
    <ellipse rx="202" ry="68" stroke="#28C7AD" stroke-width="3" stroke-dasharray="8 15"/>
    <circle r="34" stroke="#FF4F7B" stroke-width="14"/>
  </g>
  <text x="390" y="68" fill="#36E1C3" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="4">FREEMAN IPUMBU // WINDHOEK, NAMIBIA</text>
  <text x="390" y="157" fill="#F8FAFC" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-2">TECHNICAL LEADERSHIP.</text>
  <text x="390" y="217" fill="#8585FF" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="56" font-weight="800" letter-spacing="-2">SYSTEMS THAT HOLD.</text>
  <text x="393" y="284" fill="#B7C2CF" font-family="Avenir Next, Avenir, Helvetica Neue, Arial, sans-serif" font-size="22" font-weight="500">Technical Director, TPTS Namibia  •  Founder and CEO, SolarSpin Technologies</text>
  <circle cx="391" cy="335" r="5" fill="#FF5E88"/>
  <text x="412" y="342" fill="#F8FAFC" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="3">INFRASTRUCTURE / PRODUCT / RESEARCH / HANDOVER</text>
</svg>
