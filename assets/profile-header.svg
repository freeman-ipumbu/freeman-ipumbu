    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>
  <rect width="1200" height="320" rx="22" fill="url(#grid)"/>
  <path d="M0 1H1200" stroke="#5ee7ff" stroke-opacity="0.35"/>
  <path d="M0 319H1200" stroke="#ffb020" stroke-opacity="0.3"/>

