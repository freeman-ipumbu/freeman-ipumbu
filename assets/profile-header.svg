    <g fill="#0c151e" stroke="#5ee7ff">
      <circle cx="830" cy="78" r="6"/><circle cx="925" cy="123" r="8"/><circle cx="1012" cy="74" r="5"/>
      <circle cx="1123" cy="145" r="7"/><circle cx="1028" cy="234" r="6"/><circle cx="909" cy="202" r="5"/><circle cx="816" cy="256" r="7"/>
    </g>
