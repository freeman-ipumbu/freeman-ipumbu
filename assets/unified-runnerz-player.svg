<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">UNIFIED × Runnerz official music player</title>
  <desc id="desc">A deep forest product card showing a lime and founder-gold music player, adaptive run session and listening achievement badges.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#050906"/>
      <stop offset=".56" stop-color="#0d1d13"/>
      <stop offset="1" stop-color="#071009"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#14231a"/>
      <stop offset="1" stop-color="#050906"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#9affbf"/>
      <stop offset="1" stop-color="#39ff88"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#39ff88" stop-opacity=".28"/>
      <stop offset="1" stop-color="#39ff88" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="24" stdDeviation="26" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1200" height="900" rx="48" fill="url(#bg)"/>
  <circle cx="890" cy="170" r="330" fill="url(#glow)"/>
  <path d="M0 730C180 620 270 810 450 688s305-42 430-134 217-58 320-142" fill="none" stroke="#39ff88" stroke-opacity=".16" stroke-width="4"/>
  <path d="M0 750C180 640 270 830 450 708s305-42 430-134 217-58 320-142" fill="none" stroke="#39ff88" stroke-opacity=".06" stroke-width="26"/>

  <g transform="translate(72 70)">
    <text x="0" y="0" fill="#39ff88" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="5">OFFICIAL RUNNERZ MUSIC LAYER</text>
    <text x="0" y="76" fill="#f4faf6" font-family="Arial Black,Arial,sans-serif" font-size="64" font-weight="900" letter-spacing="-3">UNIFIED × RUNNERZ</text>
    <text x="0" y="118" fill="#98ad9f" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600">Your route. Your rhythm. One Namibian ecosystem.</text>
  </g>

  <g transform="translate(645 55) rotate(5 225 390)" filter="url(#shadow)">
    <rect x="0" y="0" width="450" height="790" rx="64" fill="#020503" stroke="#355443" stroke-width="5"/>
    <rect x="18" y="18" width="414" height="754" rx="50" fill="url(#screen)"/>
    <rect x="166" y="31" width="118" height="24" rx="12" fill="#020503"/>
    <text x="48" y="95" fill="#39ff88" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="900" letter-spacing="2.8">RUNNERZ MUSIC OS</text>
    <text x="48" y="132" fill="#f4faf6" font-family="Arial Black,Arial,sans-serif" font-size="28" font-weight="900">Soundtrack the movement</text>

    <rect x="42" y="162" width="366" height="220" rx="32" fill="#0c1710" stroke="#39ff88" stroke-opacity=".35"/>
    <circle cx="225" cy="250" r="70" fill="url(#lime)"/>
    <path d="M190 214h63c23 0 39 14 39 35 0 17-9 29-27 35l31 39h-36l-28-34-8 34h-38zm38 27h24c8 0 13 5 13 12 0 8-6 13-15 13h-28z" fill="#050906"/>
    <text x="225" y="350" text-anchor="middle" fill="#f4faf6" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="900" letter-spacing="2">CITY 45 • LIVE MIX</text>

    <g transform="translate(42 405)">
      <rect width="366" height="130" rx="26" fill="#102117" stroke="#d6b45a" stroke-opacity=".35"/>
      <text x="22" y="30" fill="#d6b45a" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="900" letter-spacing="2">ADAPTIVE ARC</text>
      <text x="22" y="61" fill="#f4faf6" font-family="Arial Black,Arial,sans-serif" font-size="22" font-weight="900">Warm up → Finish kick</text>
      <rect x="22" y="83" width="322" height="6" rx="3" fill="#203a2a"/>
      <rect x="22" y="83" width="246" height="6" rx="3" fill="#39ff88"/>
      <text x="22" y="111" fill="#98ad9f" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700">12 TRACKS • PLAYBACK STAYS LIVE</text>
    </g>

    <g transform="translate(42 558)">
      <rect width="112" height="110" rx="22" fill="#0c1710" stroke="#39ff88" stroke-opacity=".3"/>
      <text x="18" y="42" fill="#39ff88" font-family="Arial Black,Arial,sans-serif" font-size="28">7</text>
      <text x="18" y="66" fill="#f4faf6" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900" letter-spacing="1.4">LEVEL</text>
      <text x="18" y="91" fill="#98ad9f" font-family="Arial,Helvetica,sans-serif" font-size="9">Pathfinder</text>
      <rect x="126" width="112" height="110" rx="22" fill="#0c1710" stroke="#d6b45a" stroke-opacity=".3"/>
      <text x="144" y="42" fill="#d6b45a" font-family="Arial Black,Arial,sans-serif" font-size="28">◆</text>
      <text x="144" y="66" fill="#f4faf6" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900" letter-spacing="1.2">BADGES</text>
      <text x="144" y="91" fill="#98ad9f" font-family="Arial,Helvetica,sans-serif" font-size="9">6 unlocked</text>
      <rect x="252" width="114" height="110" rx="22" fill="#39ff88"/>
      <text x="270" y="42" fill="#050906" font-family="Arial Black,Arial,sans-serif" font-size="22">RUN ↗</text>
      <text x="270" y="69" fill="#07120b" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900">OPEN RUNNERZ</text>
    </g>
  </g>

  <g transform="translate(74 270)">
    <rect width="470" height="374" rx="38" fill="#08110b" stroke="#284133" stroke-width="2"/>
    <text x="32" y="48" fill="#d6b45a" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="900" letter-spacing="2.8">LISTENING UNIVERSE</text>
    <text x="32" y="91" fill="#f4faf6" font-family="Arial Black,Arial,sans-serif" font-size="31" font-weight="900">Unlock your sound.</text>
    <g transform="translate(32 126)">
      <rect width="124" height="148" rx="24" fill="#102117" stroke="#39ff88" stroke-opacity=".3"/>
      <text x="20" y="49" fill="#39ff88" font-family="Arial Black,Arial,sans-serif" font-size="30">∞</text>
      <text x="20" y="82" fill="#f4faf6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900">NO-SKIP</text>
      <text x="20" y="102" fill="#f4faf6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900">ZONE</text>
      <text x="20" y="128" fill="#39ff88" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900">UNLOCKED</text>
      <rect x="140" width="124" height="148" rx="24" fill="#102117" stroke="#d6b45a" stroke-opacity=".35"/>
      <text x="160" y="49" fill="#d6b45a" font-family="Arial Black,Arial,sans-serif" font-size="30">◆</text>
      <text x="160" y="82" fill="#f4faf6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900">GOLDEN</text>
      <text x="160" y="102" fill="#f4faf6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900">EAR</text>
      <text x="160" y="128" fill="#d6b45a" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900">UNLOCKED</text>
      <rect x="280" width="124" height="148" rx="24" fill="#0c1710" stroke="#284133"/>
      <text x="300" y="49" fill="#98ad9f" font-family="Arial Black,Arial,sans-serif" font-size="30">N</text>
      <text x="300" y="82" fill="#98ad9f" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900">LOCAL</text>
      <text x="300" y="102" fill="#98ad9f" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="900">LEGEND</text>
      <text x="300" y="128" fill="#98ad9f" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="900">842 / 1000</text>
    </g>
    <text x="32" y="327" fill="#98ad9f" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700">BADGES • LEVELS • PATTERNS • PRIVATE BY DESIGN</text>
  </g>

  <text x="72" y="826" fill="#f4faf6" font-family="Arial Black,Arial,sans-serif" font-size="24" font-weight="900" letter-spacing="1">RUN TOGETHER. LISTEN LOUDER.</text>
  <text x="1128" y="826" text-anchor="end" fill="#39ff88" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900" letter-spacing="3">BUILT IN NAMIBIA</text>
</svg>
